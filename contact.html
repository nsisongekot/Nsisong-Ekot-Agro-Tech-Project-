<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EcoLand Contact</title>

    <link rel="stylesheet" href="css/contact.css">
</head>

<body>

    <!-- NAVIGATION -->
    <nav>

        <div class="logo">
            <img src="images/eco land logo.png" alt="EcoLand logo">
        </div>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="service.html">Services</a></li>
            <li><a href="marketplace.html">Marketplace</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>

    </nav>


    <!-- CONTACT -->

    <section class="contact">

        <div class="contact-text">

            <p>GET IN TOUCH</p>

            <h1>Contact EcoLand</h1>

            <p>
                Have questions or need more information?
                Send us a message and we'll be happy to hear from you.
            </p>

            <p>📍 Akwa Ibom, Nigeria</p>
            <p>📧 info@ecoland.com</p>
            <p>📞 +234 912 683 6856</p>

        </div>


        <!-- CONTACT FORM -->

        <form class="contact-form" id="contactForm">

            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Your name" required>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Your email" required>

            <label for="message">Message</label>
            <textarea id="message" rows="5" placeholder="Your message" required></textarea>

            <button type="submit">Send Message</button>

            <p id="formMessage"></p>

        </form>

    </section>


    <!-- FOOTER -->

    <footer>

        <div class="social-icons">

              <a href="https://www.instagram.com/" target="_blank">
                       <img src="images/instagram logo.png" alt="Instagram">
              </a>

                 <a href="https://www.facebook.com/" target="_blank">
                         <img src="images/facebook logo.png" alt="Facebook">
                  </a>

                 <a href="https://x.com/" target="_blank">
                           <img src="images/x logo.png" alt="X">
                 </a>

            </div>

            <p>© 2026 EcoLand. All Rights Reserved.</p>

        </div>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
